name: Unity CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Unity CLIのキャッシュ
      - name: Cache Unity CLI
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/unity
          key: ${{ runner.os }}-unity-cli

      - name: Install Unity CLI
        run: |
          if [ ! -f "$HOME/.local/bin/unity" ]; then
            curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh \
            | UNITY_CLI_CHANNEL=beta bash
          fi
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Unity CLI Version
        run: unity --version

      # 2. Unity Editor本体のキャッシュ
      - name: Cache Unity Editor
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/unity
            ~/.unity
          key: ${{ runner.os }}-unity-editor-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            ${{ runner.os }}-unity-editor-

      # 3. Unity Editor & WebGLモジュールのインストール（キャッシュがあればスキップされる）
      - name: Install Unity Editor & WebGL Module
        run: |
          unity install lts -m webgl --accept-eula --yes

      # 4. UnityプロジェクトのLibraryキャッシュ
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: ${{ runner.os }}-unity-library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            ${{ runner.os }}-unity-library-

      # 5. ビルド実行（Unity CLIが管理するインストール済みエディタのパスを直接引いてバッチモード起動）
  
      - name: Run Build via Unity Editor Batchmode
        run: |
          # Unity CLIのバージョン情報を確認しつつ、実際のインストール場所を正しく探す
          echo "Checking Unity CLI and Editors..."
          unity editors --format json || true

          # Unity Editorのパスを探す（検索範囲をホームディレクトリ全体に拡大、またはUnity CLIのデフォルトパスに対応）
          UNITY_PATH=""
          
          # よくあるインストール先候補を総当たりで探す
          for p in ~/.local/share/unity/editors/*/Editor/Unity ~/.unity/editors/*/Editor/Unity ~/unity/editors/*/Editor/Unity /opt/unity/Editor/Unity; do
            if [ -f "$p" ]; then
              UNITY_PATH="$p"
              break
            fi
          done

          # それでも見つからない場合のみfindを使うが、今度はホーム全体から安全に探す
          if [ -z "$UNITY_PATH" ]; then
            echo "Searching wider for Unity executable..."
            UNITY_PATH=$(find ~ -name "Unity" -type f -executable 2>/dev/null | grep -i "Editor/Unity" | head -n 1)
          fi

          if [ -z "$UNITY_PATH" ] || [ ! -f "$UNITY_PATH" ]; then
            echo "❌ Error: Unity Editor executable could not be located anywhere!"
            exit 1
          fi

          echo "🚀 Found Unity Editor at: $UNITY_PATH"

          # バッチモードでプロジェクトを開き、静的メソッドを実行して終了
          "$UNITY_PATH" -batchmode \
                        -projectPath "$(pwd)" \
                        -executeMethod WebGLBuildCommand.Build \
                        -quit \
                        -nographics \
                        -logFile build.log


      - name: Show Build Log if Failed
        if: failure()
        run: |
          if [ -f build.log ]; then
            cat build.log
          fi

      # 6. GitHub Pagesへデプロイ
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Builds/WebGL
