name: Unity CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Unity CLIのキャッシュ
      - name: Cache Unity CLI
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/unity
          key: ${{ runner.os }}-unity-cli

      - name: Install Unity CLI
        run: |
          if [ ! -f "$HOME/.local/bin/unity" ]; then
            curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh \
            | UNITY_CLI_CHANNEL=beta bash
          fi
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Unity CLI Version
        run: unity --version

      # 2. Unity Editor本体のキャッシュ
      - name: Cache Unity Editor
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/unity
            ~/.unity
          key: ${{ runner.os }}-unity-editor-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            ${{ runner.os }}-unity-editor-

      # 3. Unity Editor & WebGLモジュールのインストール（キャッシュがあればスキップされる）
      - name: Install Unity Editor & WebGL Module
        run: |
          unity install lts -m webgl --accept-eula --yes

      # 4. UnityプロジェクトのLibraryキャッシュ
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: ${{ runner.os }}-unity-library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            ${{ runner.os }}-unity-library-

      # 5. ビルド実行（Unity CLIが管理するインストール済みエディタのパスを直接引いてバッチモード起動）
      - name: Run Build via Unity Editor Batchmode
        run: |
          # Unity CLIでインストールされたEditorの実行ファイルを探して直接バッチモードで回す
          UNITY_PATH=$(find ~/.local/share/unity -name "Unity" -type f -executable | head -n 1)
          
          if [ -z "$UNITY_PATH" ]; then
            echo "❌ Unity Editor not found!"
            exit 1
          fi

          echo "🚀 Found Unity Editor at: $UNITY_PATH"

          # バッチモードでプロジェクトを開き、静的メソッドを実行して終了
          "$UNITY_PATH" -batchmode \
                        -projectPath "$(pwd)" \
                        -executeMethod WebGLBuildCommand.Build \
                        -quit \
                        -nographics \
                        -logFile build.log

      - name: Show Build Log if Failed
        if: failure()
        run: |
          if [ -f build.log ]; then
            cat build.log
          fi

      # 6. GitHub Pagesへデプロイ
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Builds/WebGL
