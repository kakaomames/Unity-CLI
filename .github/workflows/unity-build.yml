name: Unity CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Unity CLI
        run: |
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh \
          | UNITY_CLI_CHANNEL=beta bash
          # パスを通す（環境に合わせて調整）
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Unity CLI Version
        run: unity --version

      - name: Install Unity Editor & WebGL Module
        run: |
          unity install lts -m webgl --accept-eula --yes

      - name: Run Build via Unity Pipeline / CLI
        run: |
          # プロジェクトを開いて、C#で定義したビルドコマンドを叩く！
          unity command WebGLBuildCommand

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Builds/WebGL # UnityのWebGLビルド出力先を指定
