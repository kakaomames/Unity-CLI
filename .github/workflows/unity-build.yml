name: Unity CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Unity CLIのキャッシュ（バイナリや設定）
      - name: Cache Unity CLI
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/unity
          key: ${{ runner.os }}-unity-cli

      - name: Install Unity CLI
        run: |
          if [ ! -f "$HOME/.local/bin/unity" ]; then
            curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh \
            | UNITY_CLI_CHANNEL=beta bash
          fi
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Unity CLI Version
        run: unity --version

      # 2. Unity Editor本体のキャッシュ（※インストールパスに合わせて調整が必要な場合あり）
      # Unity CLIがデフォルトでEditorを置く場所（通常 ~/.local/share/unity や Unity Hubの管理パス）をキャッシュ
      - name: Cache Unity Editor
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/unity
            ~/.unity
          key: ${{ runner.os }}-unity-editor-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            ${{ runner.os }}-unity-editor-




      - name: Run Build via Unity CLI and Batchmode
        run: |
          # Unity CLIからインストール済みEditorの一覧をJSONで取得して、エディタの実行ファイルパスを抽出する
          # （もしUnity CLIに直接ビルドコマンドがある場合はそれを使うのが一番スマートですが、確実なバッチ起動を行うであります）
          
          # Unity CLIのコマンドでエディタパスを探す、または標準的なパスを網羅的に探す
          echo "Searching for Unity Editor..."
          
          # Unity CLIが管理するパスや一般的なインストール先を探す
          UNITY_PATH=""
          
          # 候補地を順番にチェック
          for path in "$HOME/.local/share/unity/editors"/*/Editor/Unity "/Applications/Unity Hub/..." "/opt/unity/Editor/Unity" ~/.unity/editors/*/Editor/Unity; do
            if [ -f "$path" ]; then
              UNITY_PATH="$path"
              break
            fi
          done

          # もし見つからない場合、findでホームディレクトリ付近を広く探す
          if [ -z "$UNITY_PATH" ]; then
            UNITY_PATH=$(find ~ -name "Unity" -type f -executable | grep Editor | head -n 1)
          fi

          if [ -z "$UNITY_PATH" ] || [ ! -f "$UNITY_PATH" ]; then
            echo "❌ Unity Editor executable not found!"
            exit 1
          fi

          echo "🚀 Using Unity Editor at: $UNITY_PATH"

          # バッチモードでビルド実行
          "$UNITY_PATH" -batchmode \
                        -projectPath "$(pwd)" \
                        -executeMethod WebGLBuildCommand.Build \
                        -quit \
                        -nographics \
                        -logFile build.log

      - name: Show Build Log if Failed
        if: failure()
        run: |
          if [ -f build.log ]; then
            cat build.log
          fi







      - name: Install Unity Editor & WebGL Module
        run: |
          unity install lts -m webgl --accept-eula --yes

      # 3. Unityプロジェクトのビルドキャッシュ（Libraryフォルダ）
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: ${{ runner.os }}-unity-library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            ${{ runner.os }}-unity-library-

      - name: Run Build via Unity Pipeline / CLI
        run: |
          unity command WebGLBuildCommand

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Builds/WebGL
